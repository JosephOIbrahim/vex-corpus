# VEX Corpus - Source Registry
#
# Each source has:
#   id:                 Unique identifier used in chunk source_id fields
#   name:               Human-readable name
#   type:               youtube_transcript | web_scrape | github_wiki | local_skill
#   url/path:           Where to find the source material
#   authority:          0.0-1.0 trust weight (see docs/SOURCES.md for scale)
#   difficulty_range:   [min, max] difficulty levels present in this source
#   vex_contexts:       VEX contexts covered (sop, dop, cop, chop, cvex, material, solver)
#   houdini_version_era: Approximate Houdini version range the content targets
#   status:             active | planned | deprecated

sources:
  - id: joy-of-vex-youtube
    name: "Joy of VEX (YouTube - Peter Arcara)"
    type: youtube_transcript
    url: "https://youtube.com/playlist?list=PLTXmnikJEYnBtSfn4LwKx5vpopwrInp18"
    authority: 0.9
    difficulty_range: [beginner, intermediate]
    vex_contexts: [sop]
    houdini_version_era: "18.0-19.5"
    status: active
    notes: >
      Matt Estela's Joy of VEX tutorial series, recorded by Peter Arcara
      (SideFX). Imported via scripts/import_joy_of_vex.py. 1,633 chunks.
      Over-granular segmentation from timestamp-based chunking.

