  - id: sidefx-vex-reference
    name: "SideFX VEX Function Reference"
    type: web_scrape
    url: "https://www.sidefx.com/docs/houdini/vex/functions/"
    authority: 1.0
    difficulty_range: [reference]
    vex_contexts: [all]
    houdini_version_era: "20.5"
    status: planned
    notes: >
      Official VEX function reference. One chunk per function with signature,
      description, parameters, return type, example code, and context
      availability. May need local HTML fallback if scraping is blocked.

  - id: kiryha-vex-artists
    name: "VEX for Artists (kiryha)"
    type: github_wiki
    url: "https://github.com/kiryha/Houdini/wiki/vex-for-artists"
    authority: 0.7
    difficulty_range: [beginner, intermediate]
    vex_contexts: [sop]
    houdini_version_era: "18.0-19.5"
    status: planned
    notes: >
      Community wiki with beginner-friendly VEX explanations and examples.

  - id: vex-pattern-library
    name: "Production VEX Pattern Library"
    type: local_skill
    path: "~/.claude/skills/vex-pattern-library/"
    authority: 0.85
    difficulty_range: [intermediate, expert]
    vex_contexts: [sop, dop]
    houdini_version_era: "20.0-20.5"
    status: planned
    notes: >
      Production-tested VEX patterns from real projects. Self-authored,
      covers advanced topics like solver patterns and packed prims.
